# ============================================================
#  AgroConnecta — Docker Compose (prueba piloto en red local)
#
#  ./iniciar.sh        → crea .env, construye y levanta todo
#  docker compose ps   → ver estado        docker compose logs -f api → ver logs
#  docker compose down → detener (los datos se conservan en los volúmenes)
#
#  Servicios:  db (PostgreSQL 16 + PostGIS)  →  api (Node.js)  →  web (Nginx, puerto 8080)
# ============================================================
name: agroconnecta

services:
  db:
    build: ./db
    image: agroconnecta/db:3.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: agroconnecta
      POSTGRES_USER: ${DB_ADMIN_USER:-agro_admin}          # el único usuario que administra todo
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Define DB_ADMIN_PASSWORD en .env}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en .env}
      READONLY_DB_PASSWORD: ${DB_READONLY_PASSWORD:?Define DB_READONLY_PASSWORD en .env}
      TZ: America/Mexico_City
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"      # solo desde tu Mac (pgAdmin / DBeaver); NO visible en la red
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d agroconnecta"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    image: agroconnecta/api:3.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: agroconnecta
      DB_USER: agro_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Define DATA_ENCRYPTION_KEY en .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@agroconnecta.mx}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AgroAdmin#2026}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo#2026}
      VERSION_AVISO: ${VERSION_AVISO:-2026-11}
      PAGO_SIMULADO: ${PAGO_SIMULADO:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      TRUST_PROXY: "1"
      TZ: America/Mexico_City
    volumes:
      - uploads:/data/uploads
      - documentos:/data/privado     # INE y comprobantes CIFRADOS (no se publican)

  web:
    build: ./frontend
    image: agroconnecta/web:3.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-8080}:8080"   # 0.0.0.0 → accesible desde los celulares en la misma red Wi-Fi

volumes:
  pgdata:
  uploads:
  documentos:

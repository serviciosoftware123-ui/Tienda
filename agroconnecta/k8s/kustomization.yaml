# kubectl apply -k k8s/
# (antes crea el secreto: kubectl -n agroconnecta create secret generic agroconnecta-secretos --from-env-file=.env)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agroconnecta
resources:
  - 00-namespace.yaml
  - 02-configmap.yaml
  - 03-postgres.yaml
  - 04-api.yaml
  - 05-web.yaml
  - 06-ingress.yaml
  - 07-networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: agroconnecta
    includeSelectors: false

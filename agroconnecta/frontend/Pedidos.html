<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - AgroConnecta</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="img/favicon.svg">
    <script src="js/api.js"></script>
    <script src="agro_data.js"></script>
</head>
<body class="bg-[#F8F7F2] flex min-h-screen">
    <div id="sidebar-root" data-page="pedidos"></div>

    <main class="flex-1 p-8 overflow-y-auto min-w-0">
        <header class="mb-8">
            <h2 class="text-4xl font-serif text-[#0B2319] mb-1" id="titulo">Pedidos</h2>
            <p class="text-gray-400 text-sm" id="pedidos-count">Cargando…</p>
        </header>

        <div id="banner" class="hidden mb-6"></div>

        <!-- GET /api/pedidos?estado=&buscar= → la BD (RLS) decide qué pedidos ve cada rol -->
        <div class="flex flex-wrap gap-3 mb-8">
            <div class="flex-1 min-w-[220px] relative">
                <span class="absolute inset-y-0 left-4 flex items-center text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input id="search-pedidos" type="search" placeholder="Buscar por # de pedido…" inputmode="numeric"
                       class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-[#4fb877]/20 shadow-sm">
            </div>
            <select id="filter-estado" class="px-4 py-3 rounded-xl border border-gray-200 bg-white text-gray-600 shadow-sm">
                <option value="">Todos</option>
                <option value="PENDIENTE">Pendiente</option>
                <option value="CONFIRMADO">Confirmado</option>
                <option value="EN_CAMINO">En camino</option>
                <option value="ENTREGADO">Entregado</option>
                <option value="CANCELADO">Cancelado</option>
                <option value="DEVUELTO">Devuelto</option>
            </select>
        </div>

        <div id="pedidos-lista" class="space-y-4"></div>
        <div id="empty-pedidos" class="hidden flex-col items-center justify-center py-24 text-center">
            <div class="bg-gray-100 p-5 rounded-2xl mb-4">
                <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <p class="text-[#0B2319] font-semibold text-lg">Sin pedidos</p>
            <p class="text-gray-400 text-sm">No hay pedidos con los filtros actuales.</p>
        </div>
    </main>

    <script>
        const sesion = API.requireLogin();
        const ROL = sesion ? sesion.tipo_usuario : null;
        const params = new URLSearchParams(location.search);
        let pedidos = [];

        if (ROL === 'VENDEDOR') document.getElementById('titulo').textContent = 'Pedidos recibidos';
        if (ROL === 'ADMINISTRADOR') document.getElementById('titulo').textContent = 'Todos los pedidos';

        function pedidoCard(p) {
            const b = UI.ESTADO_PEDIDO[p.estado] || UI.ESTADO_PEDIDO.PENDIENTE;
            const pagoPend = ROL === 'COMPRADOR' && p.estado === 'PENDIENTE' && ['PENDIENTE', 'RECHAZADO', 'CANCELADO'].includes(p.pago_estado)
                && p.pago_metodo !== 'EFECTIVO';
            const quien = ROL === 'COMPRADOR' ? `<a class="hover:underline" href="Perfil.html?vendedor=${p.id_vendedor}">🏪 ${UI.esc(p.vendedor_nombre)}</a>`
                : `<a class="hover:underline" href="Perfil.html?comprador=${p.id_comprador}">🛒 ${UI.esc(p.comprador)}</a>${ROL === 'ADMINISTRADOR' ? ` → <a class="hover:underline" href="Perfil.html?vendedor=${p.id_vendedor}">${UI.esc(p.vendedor_nombre)}</a>` : ''}`;
            return `
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-start gap-4 min-w-0">
                    <div class="bg-[#F3F9F6] p-3 rounded-xl hidden sm:block">
                        <svg class="w-6 h-6 text-[#2E6B42]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    </div>
                    <div class="min-w-0">
                        <p class="font-bold text-[#0B2319] text-sm">Pedido #${p.folio} <span class="font-normal text-gray-400">· ${UI.fecha(p.fecha_pedido, false)}</span></p>
                        <p class="text-xs text-gray-500 truncate">${UI.esc(p.productos || '')}</p>
                        <p class="text-xs text-gray-400 mt-0.5">${quien} · ${p.modalidad_entrega === 'ENVIO' ? '📦 Envío' : '🏪 Recolección'}</p>
                        <p class="text-[11px] mt-1">${UI.badge(UI.METODO[p.pago_metodo] + ': ' + p.pago_estado, UI.ESTADO_PAGO[p.pago_estado] || '')}
                           ${p.custodia_estado && p.custodia_estado !== 'SIN_PAGO' ? UI.badge((UI.CUSTODIA[p.custodia_estado] || {}).l, (UI.CUSTODIA[p.custodia_estado] || {}).c) : ''}
                           ${p.devolucion_estado ? UI.badge('Devolución ' + p.devolucion_estado, 'bg-purple-50 text-purple-700') : ''}</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 flex-wrap sm:flex-nowrap justify-between">
                    <div class="text-left sm:text-right">
                        <p class="text-xl font-bold text-[#2E6B42]">${UI.money(p.total)}</p>
                        <p class="text-xs text-gray-400">${ROL === 'VENDEDOR' && p.neto_vendedor !== undefined ? `Tu neto: <b class="text-[#0B2319]">${UI.money(p.neto_vendedor)}</b>` : 'IVA y flete incluidos'}</p>
                    </div>
                    ${UI.badge(b.l, b.c)}
                    ${pagoPend ? `<button onclick="pagarAhora('${p.grupo_compra}')" class="bg-[#f59e0b] text-[#0B2319] px-3 py-2 rounded-xl text-xs font-bold">Pagar</button>` : ''}
                    ${ROL === 'COMPRADOR' && p.estado === 'ENTREGADO' && !p.recepcion_confirmada_en ? `<button onclick="confirmarRecibido('${p.id_pedido}', ${p.folio})" class="bg-[#f59e0b] text-[#0B2319] px-3 py-2 rounded-xl text-xs font-bold">Confirmar recibido</button>` : ''}
                    <a href="Seguimiento.html?pedido=${p.id_pedido}" class="bg-[#2E6B42] text-white px-3 py-2 rounded-xl text-xs font-semibold hover:bg-[#245534]">Seguimiento</a>
                    <button onclick="verDetalle('${p.id_pedido}')" class="border border-gray-200 text-[#0B2319] px-3 py-2 rounded-xl text-xs font-semibold hover:bg-gray-50">Detalle</button>
                </div>
            </div>`;
        }

        let timer;
        async function cargar() {
            const q = document.getElementById('search-pedidos').value.trim();
            const estado = document.getElementById('filter-estado').value;
            try {
                pedidos = await API.get(`/pedidos?limit=100&estado=${estado}&buscar=${encodeURIComponent(q)}`);
            } catch (e) { return UI.toast(e.message, 'error'); }
            document.getElementById('pedidos-lista').innerHTML = pedidos.map(pedidoCard).join('');
            const n = pedidos.length;
            document.getElementById('empty-pedidos').style.display = n === 0 ? 'flex' : 'none';
            document.getElementById('pedidos-count').textContent = `${n} pedido${n !== 1 ? 's' : ''}`;
        }

        // ── Detalle ────────────────────────────────────────────
        const PASOS = ['PENDIENTE', 'CONFIRMADO', 'EN_CAMINO', 'ENTREGADO'];
        function linea(p) {
            if (['CANCELADO', 'DEVUELTO'].includes(p.estado)) return '';
            const i = PASOS.indexOf(p.estado);
            const nombres = ['Recibido', 'Confirmado', p.modalidad_entrega === 'ENVIO' ? 'En camino' : 'Listo p/ recoger', 'Entregado'];
            return `<div class="flex items-center gap-1 my-5">${PASOS.map((s, k) => `
                <div class="flex-1"><div class="h-1.5 rounded-full ${k <= i ? 'bg-[#2E6B42]' : 'bg-gray-200'}"></div>
                <p class="text-[10px] mt-1 ${k <= i ? 'text-[#2E6B42] font-semibold' : 'text-gray-400'}">${nombres[k]}</p></div>`).join('')}</div>`;
        }

        function acciones(p) {
            const a = [];
            if (ROL === 'VENDEDOR' || ROL === 'ADMINISTRADOR') {
                const pagoOk = !p.pago || ['APROBADO'].includes(p.pago.estado) || ['EFECTIVO', 'FINANCIAMIENTO'].includes(p.pago.metodo);
                if (p.estado === 'PENDIENTE') a.push(pagoOk
                    ? `<button class="btn-verde" onclick="cambiarEstado('${p.id_pedido}','CONFIRMADO')">Confirmar pedido</button>`
                    : `<span class="text-xs text-orange-600 bg-orange-50 px-3 py-2 rounded-xl">Esperando el pago del comprador</span>`);
                if (p.estado === 'CONFIRMADO') a.push(`<button class="btn-verde" onclick="cambiarEstado('${p.id_pedido}','EN_CAMINO')">${p.modalidad_entrega === 'ENVIO' ? 'Marcar en camino' : 'Listo para recoger'}</button>`);
                if (p.estado === 'EN_CAMINO') a.push(`<button class="btn-verde" onclick="cambiarEstado('${p.id_pedido}','ENTREGADO')">Marcar entregado</button>`);
                if (['PENDIENTE', 'CONFIRMADO'].includes(p.estado)) a.push(`<button class="btn-borde text-red-500" onclick="cambiarEstado('${p.id_pedido}','CANCELADO')">Cancelar</button>`);
            }
            if (ROL === 'COMPRADOR') {
                if (p.estado === 'PENDIENTE') a.push(`<button class="btn-borde text-red-500" onclick="cambiarEstado('${p.id_pedido}','CANCELADO')">Cancelar pedido</button>`);
                if (p.estado === 'ENTREGADO' && !p.recepcion_confirmada_en) a.push(`<button class="btn-verde" onclick="confirmarRecibido('${p.id_pedido}', ${p.folio})">✓ Confirmar que lo recibí</button>`);
                if (p.estado === 'ENTREGADO' && !p.calificacion) a.push(`<button class="btn-verde" onclick="calificar('${p.id_pedido}', ${p.folio})">★ Calificar al vendedor</button>`);
                const reclamable = p.custodia_estado !== 'LIBERADO';
                if (p.estado === 'ENTREGADO' && !p.devolucion && reclamable) a.push(`<button class="btn-borde" onclick="devolver('${p.id_pedido}', ${p.folio}, 'DEVOLUCION')">Solicitar devolución</button>`);
                if (p.estado === 'EN_CAMINO' && !p.devolucion) a.push(`<button class="btn-borde" onclick="devolver('${p.id_pedido}', ${p.folio}, 'DISPUTA')">Abrir disputa (no llega)</button>`);
            }
            if (p.devolucion) a.push(`<button class="btn-borde" onclick="mediacion('${p.devolucion.id_devolucion}')">💬 Mediación del caso</button>`);
            return a.join('');
        }

        function custodiaInfo(p) {
            const c = p.custodia_estado;
            if (!c || c === 'SIN_PAGO' || c === 'NO_APLICA') return c === 'NO_APLICA' && ROL !== 'COMPRADOR' && p.estado === 'ENTREGADO'
              ? `<p class="text-[11px] text-gray-500 bg-gray-50 rounded-xl p-3">Pago directo (efectivo o financiamiento): la comisión se descuenta en tu siguiente liquidación.</p>` : '';
            const k = UI.CUSTODIA[c];
            let txt = '';
            if (c === 'RETENIDO') txt = p.liberar_despues_de
              ? `Se libera al vendedor el <b>${UI.fechaHora(p.liberar_despues_de)}</b>${p.recepcion_automatica ? ' (recepción confirmada automáticamente)' : ''}, salvo que haya un reclamo abierto.`
              : (p.estado === 'ENTREGADO' ? 'Esperando que el comprador confirme de recibido (si no, se confirma solo a los 7 días).' : 'El dinero está protegido hasta que el comprador reciba su pedido.');
            if (c === 'LIBERADO') txt = `Pago entregado al vendedor el ${UI.fechaHora(p.custodia_liberada_en)}.`;
            if (c === 'REEMBOLSADO') txt = 'El pago se reembolsó al comprador.';
            return `<div class="rounded-xl p-4 text-xs flex gap-3 ${k.c}"><span class="text-lg">🔒</span><div><p class="font-bold">${k.l}</p><p class="mt-0.5">${txt}</p></div></div>`;
        }

        async function confirmarRecibido(id, folio) {
            if (!confirm(`¿Recibiste completo el pedido #${folio}? En 48 h se libera el pago al vendedor.`)) return;
            try {
                const r = await API.post(`/pedidos/${id}/recibido`);
                UI.toast(r.liberar_despues_de ? `¡Gracias! El pago se libera el ${UI.fechaHora(r.liberar_despues_de)}` : '¡Gracias por confirmar!');
                await cargar(); verDetalle(id);
            } catch (e) { UI.toast(e.message, 'error'); }
        }

        async function mediacion(idDev) {
            let d;
            try { d = await API.get(`/devoluciones/${idDev}/mensajes`); } catch (e) { return UI.toast(e.message, 'error'); }
            const cerrado = ['APROBADA', 'RECHAZADA', 'RESUELTA'].includes(d.estado);
            UI.modal.open(`<div class="p-6 border-b border-gray-100 flex justify-between items-start">
                <div><p class="text-xs text-gray-400">${d.tipo === 'DISPUTA' ? 'Disputa' : 'Devolución'} · pedido #${d.folio}</p>
                <h3 class="font-bold text-[#0B2319] text-lg">Mediación AgroConnecta</h3>
                <p class="text-xs text-gray-500 mt-1">${UI.esc(d.motivo)}</p></div>${UI.badge(d.estado, 'bg-purple-50 text-purple-700')}</div>
              <div class="p-6 space-y-3 max-h-[50vh] overflow-y-auto">${d.mensajes.length ? d.mensajes.map(m => `
                <div class="flex ${m.mio ? 'justify-end' : ''}"><div class="max-w-[80%] rounded-2xl px-4 py-2 text-sm ${m.mio ? 'bg-[#2E6B42] text-white' : m.rol === 'ADMINISTRADOR' ? 'bg-amber-50 text-[#0B2319]' : 'bg-gray-100 text-[#0B2319]'}">
                  <p class="text-[10px] opacity-70 font-semibold">${UI.esc(m.autor)} · ${m.rol === 'ADMINISTRADOR' ? 'Mediador' : m.rol === 'VENDEDOR' ? 'Vendedor' : 'Comprador'}</p>
                  <p class="whitespace-pre-line">${UI.esc(m.mensaje)}</p><p class="text-[10px] opacity-60 text-right">${UI.fechaHora(m.fecha)}</p></div></div>`).join('')
                : '<p class="text-sm text-gray-400 text-center py-4">Aún no hay mensajes. Cuenta tu versión con detalle.</p>'}
                ${d.resolucion ? `<p class="text-xs bg-green-50 text-green-700 rounded-xl p-3">Resolución: ${UI.esc(d.resolucion)}</p>` : ''}</div>
              ${cerrado ? '<p class="px-6 pb-6 text-xs text-gray-400">El caso está cerrado.</p>' : `
              <form class="p-6 pt-0 flex gap-2" id="f-med"><input id="med-msg" class="agro-input" maxlength="2000" placeholder="Escribe un mensaje…" required>
                <button class="btn-verde">Enviar</button></form>`}`, { ancho: 'max-w-lg' });
            const f = document.getElementById('f-med');
            if (f) f.onsubmit = async e => {
                e.preventDefault();
                try { await API.post(`/devoluciones/${idDev}/mensajes`, { mensaje: document.getElementById('med-msg').value }); mediacion(idDev); }
                catch (err) { UI.toast(err.message, 'error'); }
            };
        }

        async function verDetalle(id) {
            let p;
            try { p = await API.get('/pedidos/' + id); } catch (e) { return UI.toast(e.message, 'error'); }
            if (ROL === 'VENDEDOR' && !window._trans) { try { window._trans = await API.get('/transportistas'); } catch (_) { window._trans = []; } }
            const b = UI.ESTADO_PEDIDO[p.estado];
            const env = p.envio || {};
            UI.modal.open(`
              <div class="p-6 border-b border-gray-100 flex items-start justify-between gap-3">
                <div><p class="text-xs text-gray-400">${UI.fechaHora(p.fecha_pedido)}</p>
                  <h3 class="font-bold text-[#0B2319] text-xl">Pedido #${p.folio}</h3>
                  <p class="text-sm text-gray-500">${ROL === 'COMPRADOR' ? `<a class="text-[#2E6B42] hover:underline" href="Perfil.html?vendedor=${p.id_vendedor}">🏪 ${UI.esc(p.vendedor_nombre)}</a>`
                    : `<a class="text-[#2E6B42] hover:underline" href="Perfil.html?comprador=${p.id_comprador}">🛒 ${UI.esc(p.comprador)}</a>`}
                    · <a class="text-[#2E6B42] hover:underline" href="Seguimiento.html?pedido=${p.id_pedido}">Ver seguimiento →</a></p></div>
                <div class="flex items-center gap-2">${UI.badge(b.l, b.c)}<button onclick="UI.modal.close()" class="text-gray-400 ml-2">✕</button></div>
              </div>
              <div class="p-6 space-y-5 text-sm">
                ${linea(p)}
                <div class="space-y-3">${p.detalles.map(d => `
                  <div class="flex items-center gap-3">
                    <img src="${UI.img(d.imagen)}" class="w-12 h-12 rounded-lg object-cover border border-gray-100" onerror="this.src=UI.FALLBACK_IMG">
                    <div class="flex-1"><p class="font-semibold text-[#0B2319]">${UI.esc(d.nombre_producto)}</p>
                      <p class="text-xs text-gray-400">${d.cantidad} ${UI.esc(d.unidad)} × ${UI.money(d.precio_unitario)} · IVA ${Math.round(Number(d.tasa_iva) * 100)} %</p></div>
                    <p class="font-semibold">${UI.money(d.subtotal)}</p></div>`).join('')}</div>
                <div class="bg-[#F8F7F2] rounded-xl p-4 space-y-1">
                  <div class="flex justify-between text-gray-500"><span>Subtotal</span><span>${UI.money(p.subtotal)}</span></div>
                  <div class="flex justify-between text-gray-500"><span>IVA</span><span>${UI.money(p.impuestos_iva)}</span></div>
                  <div class="flex justify-between text-gray-500"><span>Flete${p.distancia_km ? ` (${p.distancia_km} km)` : ''}</span><span>${UI.money(p.costo_envio)}</span></div>
                  <div class="flex justify-between font-bold text-[#0B2319] pt-1 border-t border-gray-200"><span>Total</span><span>${UI.money(p.total)}</span></div>
                </div>
                ${p.neto_vendedor !== undefined ? `<div class="border border-[#d7ebdf] bg-[#F3F9F6] rounded-xl p-4 space-y-1">
                  <p class="text-xs text-gray-500 uppercase font-semibold mb-1">Liquidación ${ROL === 'VENDEDOR' ? 'para ti' : 'del vendedor'}</p>
                  <div class="flex justify-between text-gray-600"><span>Venta (productos + IVA)</span><span>${UI.money(Number(p.subtotal) + Number(p.impuestos_iva))}</span></div>
                  <div class="flex justify-between text-gray-600"><span>Comisión AgroConnecta ${(p.comision_pct * 100).toFixed(0)} %</span><span>−${UI.money(p.comision_monto)}</span></div>
                  <div class="flex justify-between text-gray-600"><span>IVA de la comisión (acreditable)</span><span>−${UI.money(p.iva_comision)}</span></div>
                  <div class="flex justify-between font-bold text-[#0B2319] pt-1 border-t border-[#d7ebdf]"><span>Neto ${ROL === 'VENDEDOR' ? 'que recibes' : 'al vendedor'}</span><span>${UI.money(p.neto_vendedor)}</span></div>
                  <p class="text-[11px] text-gray-400">El flete se paga al transportista aliado${Number(p.margen_logistica) ? ` (la plataforma retiene ${UI.money(p.margen_logistica)} de gestión)` : ''}.</p>
                </div>` : ''}
                ${custodiaInfo(p)}
                <div class="grid sm:grid-cols-2 gap-3">
                  <div class="border border-gray-100 rounded-xl p-4">
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">Pago</p>
                    ${p.pago ? `<p class="font-semibold">${UI.METODO[p.pago.metodo]}</p><p class="mt-1">${UI.badge(p.pago.estado, UI.ESTADO_PAGO[p.pago.estado])}</p>
                      ${p.pago.referencia ? `<p class="text-[11px] text-gray-400 mt-1">Ref. ${UI.esc(p.pago.referencia)}</p>` : ''}` : '—'}
                    ${p.financiamiento ? `<p class="text-xs text-gray-500 mt-2">${p.financiamiento.num_plazos} pagos de ${UI.money(p.financiamiento.monto_plazo)} · ${p.financiamiento.plazos_pagados} pagados · ${p.financiamiento.estado}</p>` : ''}
                  </div>
                  <div class="border border-gray-100 rounded-xl p-4">
                    <p class="text-xs text-gray-400 uppercase font-semibold mb-1">${p.modalidad_entrega === 'ENVIO' ? 'Envío' : 'Recolección'}</p>
                    ${p.direccion_entrega ? `<p class="text-xs text-gray-600">${UI.esc(p.direccion_entrega)}</p>` : ''}
                    ${env.transportista ? `<p class="text-xs mt-1">🚚 ${UI.esc(env.transportista_aliado || env.transportista)}${env.transportista_telefono ? ' · ' + UI.esc(env.transportista_telefono) : ''} · guía ${UI.esc(env.numero_guia || '—')}</p>` : ''}
                    ${env.fecha_estimada ? `<p class="text-xs text-gray-400 mt-1">Estimado: ${UI.fecha(env.fecha_estimada)}</p>` : ''}
                    ${(ROL === 'VENDEDOR') && ['CONFIRMADO', 'EN_CAMINO'].includes(p.estado) && p.modalidad_entrega === 'ENVIO' ? `
                      <div class="mt-2 space-y-2"><select id="g-trans" class="agro-input !py-1.5 text-xs"><option value="">Transportista aliado…</option>${(window._trans || []).map(t =>
                        `<option value="${t.id_transportista}" ${t.id_transportista === env.id_transportista ? 'selected' : ''}>${UI.esc(t.nombre)} · ${UI.esc(t.vehiculo || '')}</option>`).join('')}</select>
                      <div class="flex gap-2"><input id="g-guia" class="agro-input !py-1.5 text-xs" placeholder="Guía / folio" value="${UI.esc(env.numero_guia || '')}">
                      <button class="btn-borde !px-3 !py-1.5 text-xs" onclick="guardarGuia('${p.id_pedido}')">Guardar</button></div></div>` : ''}
                  </div>
                </div>
                ${env.historial && env.historial.length ? `<div><p class="text-xs text-gray-400 uppercase font-semibold mb-2">Seguimiento</p>
                  <ol class="border-l-2 border-[#4fb877]/40 ml-2 space-y-2">${env.historial.map(h => `
                    <li class="pl-4 relative"><span class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-[#4fb877]"></span>
                    <p class="font-semibold text-[#0B2319] text-xs">${UI.esc(h.descripcion || h.estado_nuevo)}</p>
                    <p class="text-[11px] text-gray-400">${UI.fechaHora(h.fecha_cambio)}</p></li>`).join('')}</ol></div>` : ''}
                ${p.calificacion ? `<div class="bg-yellow-50 rounded-xl p-4"><div class="flex gap-0.5">${UI.stars(p.calificacion.puntuacion)}</div>
                  ${p.calificacion.comentario ? `<p class="text-sm mt-1">${UI.esc(p.calificacion.comentario)}</p>` : ''}</div>` : ''}
                ${p.devolucion ? `<div class="bg-purple-50 rounded-xl p-4 text-xs"><p class="font-semibold text-purple-700">Devolución: ${UI.esc(p.devolucion.estado)}</p>
                  <p class="text-gray-600 mt-1">${UI.esc(p.devolucion.motivo)}</p>${p.devolucion.resolucion ? `<p class="mt-1">Resolución: ${UI.esc(p.devolucion.resolucion)}</p>` : ''}</div>` : ''}
                ${p.notas ? `<p class="text-xs text-gray-500">Notas: ${UI.esc(p.notas)}</p>` : ''}
                <div class="flex flex-wrap gap-2 pt-1">${acciones(p)}</div>
              </div>`, { ancho: 'max-w-2xl' });
        }

        async function cambiarEstado(id, estado) {
            if (estado === 'CANCELADO' && !confirm('¿Cancelar este pedido? El stock regresará al vendedor.')) return;
            try {
                await API.put(`/pedidos/${id}/estado`, { estado });
                UI.toast('Pedido actualizado');
                await cargar(); verDetalle(id);
            } catch (e) { UI.toast(e.message, 'error'); }
        }
        async function guardarGuia(id) {
            try {
                await API.put(`/pedidos/${id}/envio`, { id_transportista: document.getElementById('g-trans').value || undefined, numero_guia: document.getElementById('g-guia').value });
                UI.toast('Envío actualizado'); verDetalle(id);
            } catch (e) { UI.toast(e.message, 'error'); }
        }

        function calificar(id, folio) {
            let p = 5;
            UI.modal.open(`<div class="p-6 space-y-4">
                <h3 class="font-bold text-[#0B2319] text-lg">Califica el pedido #${folio}</h3>
                <div id="estrellas" class="flex gap-1 justify-center"></div>
                <textarea id="cal-com" rows="3" class="agro-input" placeholder="¿Cómo fue tu experiencia? (opcional)" maxlength="1000"></textarea>
                <button class="btn-verde w-full" id="btn-cal">Enviar calificación</button></div>`, { ancho: 'max-w-sm' });
            const pintar = () => document.getElementById('estrellas').innerHTML = [1, 2, 3, 4, 5].map(n =>
                `<button onclick="window._setP(${n})" class="text-4xl ${n <= p ? 'text-[#f59e0b]' : 'text-gray-200'}">★</button>`).join('');
            window._setP = n => { p = n; pintar(); };
            pintar();
            document.getElementById('btn-cal').onclick = async () => {
                try {
                    await API.post('/calificaciones', { id_pedido: id, puntuacion: p, comentario: document.getElementById('cal-com').value });
                    UI.modal.close(); UI.toast('¡Gracias por tu calificación!'); cargar();
                } catch (e) { UI.toast(e.message, 'error'); }
            };
        }

        function devolver(id, folio, tipo = 'DEVOLUCION') {
            UI.modal.open(`<div class="p-6 space-y-4">
                <h3 class="font-bold text-[#0B2319] text-lg">${tipo === 'DISPUTA' ? 'Disputa' : 'Devolución'} del pedido #${folio}</h3>
                <p class="text-xs text-gray-500">Mientras se revisa tu caso, el pago sigue en custodia: el vendedor no lo recibe.</p>
                <textarea id="dev-mot" rows="4" class="agro-input" placeholder="${tipo === 'DISPUTA' ? 'Describe qué pasó (no ha llegado, la guía no avanza…)' : 'Describe el problema (producto dañado, incompleto, etc.)'}" maxlength="2000"></textarea>
                <label class="block text-xs text-gray-500">Foto de evidencia (opcional)<input id="dev-foto" type="file" accept="image/*" class="block mt-1 text-xs"></label>
                <button class="btn-verde w-full" id="btn-dev">Enviar solicitud</button>
                <p class="text-[11px] text-gray-400">El administrador revisará tu caso. Si se aprueba, el pago se reembolsa y el stock regresa al vendedor.</p></div>`, { ancho: 'max-w-md' });
            document.getElementById('btn-dev').onclick = async () => {
                try {
                    let evidencia;
                    const f = document.getElementById('dev-foto').files[0];
                    if (f) { const fd = new FormData(); fd.append('imagen', f); evidencia = (await API.upload('/imagenes/subir', fd)).url; }
                    await API.post('/devoluciones', { id_pedido: id, tipo, motivo: document.getElementById('dev-mot').value, evidencia_url: evidencia });
                    UI.modal.close(); UI.toast('Solicitud enviada'); cargar();
                } catch (e) { UI.toast(e.message, 'error'); }
            };
        }

        // ── Pagar un pedido pendiente (o regresar de Stripe / Mercado Pago) ──
        async function pagarAhora(grupo) {
            const cfg = await AGRO_DB.getConfig();
            const met = cfg.metodos_pago.filter(m => m.id !== 'FINANCIAMIENTO');
            UI.modal.open(`<div class="p-6 space-y-3">
                <h3 class="font-bold text-[#0B2319] text-lg">Elige cómo pagar</h3>
                ${met.map(m => `<button onclick="reintentar('${grupo}','${m.id}')" class="w-full text-left border border-gray-200 rounded-xl p-3 hover:bg-[#F3F9F6]">
                  <span class="block font-semibold text-sm">${UI.esc(m.nombre)}</span><span class="text-xs text-gray-500">${UI.esc(m.descripcion)}</span></button>`).join('')}
              </div>`, { ancho: 'max-w-sm' });
        }
        async function reintentar(grupo, metodo) {
            try {
                const r = await API.post(`/pedidos/grupo/${grupo}/pagar`, { metodo_pago: metodo });
                if (r.pago.tipo === 'REDIRECT') { location.href = r.pago.url; return; }
                if (r.pago.tipo === 'SIMULADO') { tarjetaSimulada(grupo, r.pago.total); return; }
                if (r.pago.tipo === 'SPEI') { UI.pagoSpei(r.pago, { volver: 'Pedidos.html', simular: () => API.post('/pagos/spei/simular', { grupo }) }); return; }
                UI.modal.close(); UI.toast('Método de pago actualizado'); cargar();
            } catch (e) { UI.toast(e.message, 'error'); }
        }
        function tarjetaSimulada(grupo, total) {
            UI.modal.open(`<form class="p-6 space-y-3" id="f-sim">
                <p class="text-xs text-gray-400 uppercase font-semibold">Pago de prueba</p>
                <p class="text-3xl font-bold text-[#2E6B42]">${UI.money(total)}</p>
                <input id="sim-num" class="agro-input" value="4242 4242 4242 4242" inputmode="numeric" maxlength="19">
                <p class="text-[11px] text-gray-400">4242… aprobada · 4000 0000 0000 0002 rechazada</p>
                <button class="btn-verde w-full">Pagar</button></form>`, { ancho: 'max-w-sm' });
            document.getElementById('f-sim').onsubmit = async (e) => {
                e.preventDefault();
                try {
                    const r = await API.post('/pagos/simulado/confirmar', { grupo, tarjeta: document.getElementById('sim-num').value });
                    UI.modal.close(); UI.toast(r.estado === 'APROBADO' ? '✓ Pago aprobado' : 'Pago rechazado', r.estado === 'APROBADO' ? 'ok' : 'error'); cargar();
                } catch (err) { UI.toast(err.message, 'error'); }
            };
        }

        async function regresoDePago() {
            const tipo = params.get('pago');
            if (!tipo) return;
            const banner = document.getElementById('banner');
            const pintar = (ok, msg) => {
                banner.className = `mb-6 rounded-2xl p-4 text-sm font-semibold ${ok ? 'bg-green-50 text-green-700' : 'bg-orange-50 text-orange-700'}`;
                banner.textContent = msg;
            };
            try {
                if (tipo === 'stripe' && params.get('session_id')) {
                    const r = await API.post('/pagos/stripe/confirmar', { session_id: params.get('session_id') });
                    pintar(r.estado === 'APROBADO', r.estado === 'APROBADO' ? '✓ Pago con Stripe aprobado' : 'El pago con Stripe sigue pendiente');
                } else if (tipo === 'mercadopago' && (params.get('payment_id') || params.get('collection_id'))) {
                    const r = await API.post('/pagos/mercadopago/confirmar', { payment_id: params.get('payment_id') || params.get('collection_id') });
                    pintar(r.estado === 'APROBADO', r.estado === 'APROBADO' ? '✓ Pago con Mercado Pago aprobado' : `Mercado Pago: pago ${r.estado.toLowerCase()}`);
                } else if (tipo === 'cancelado' || tipo === 'fallido') {
                    pintar(false, 'El pago no se completó. Puedes reintentarlo con el botón "Pagar".');
                } else if (tipo === 'pendiente') {
                    pintar(false, 'Tu pago está en proceso. Te avisaremos cuando se apruebe.');
                }
            } catch (e) { pintar(false, e.message); }
            history.replaceState(null, '', 'Pedidos.html');
        }

        if (sesion) {
            document.getElementById('search-pedidos').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(cargar, 300); });
            document.getElementById('filter-estado').addEventListener('change', cargar);
            regresoDePago().then(cargar);
        }
    </script>
    <script src="Barra_Lateral.js"></script>
</body>
</html>
